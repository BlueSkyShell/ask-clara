packages:
  - engine
  - bench
  - shell/extension
  - desktop
# Electron Forge packages node_modules and can't follow pnpm's symlinked layout.
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  electron: true
# Electron Forge pins @electron/node-gyp by git commit; pin it to the identical
# npm-registry release instead so the supply-chain policy (no exotic subdeps) holds.
# Not exercised at runtime — QVAC ships prebuilt Bare addons, so no native rebuild.
overrides:
  "@electron/node-gyp": 10.2.0-electron.2
