<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b9a8ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6fd6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ambient fill -->
  <circle cx="100" cy="100" r="96" fill="url(#bg)"/>

  <!-- Outer equatorial ring -->
  <ellipse cx="100" cy="100" rx="88" ry="26" stroke="#6fd6ff" stroke-width="2.5" opacity="0.9" filter="url(#glow)"/>

  <!-- Tilted ring 1 -->
  <ellipse cx="100" cy="100" rx="88" ry="26" stroke="#b9a8ff" stroke-width="1.5" opacity="0.65" transform="rotate(60 100 100)" filter="url(#glow)"/>

  <!-- Tilted ring 2 -->
  <ellipse cx="100" cy="100" rx="88" ry="26" stroke="#ffb3e0" stroke-width="1.5" opacity="0.5" transform="rotate(-60 100 100)" filter="url(#glow)"/>

  <!-- Vertical ring -->
  <ellipse cx="100" cy="100" rx="88" ry="26" stroke="#6fd6ff" stroke-width="1" opacity="0.3" transform="rotate(90 100 100)"/>

  <!-- Center core -->
  <circle cx="100" cy="100" r="9" fill="#6fd6ff" opacity="0.95" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="5" fill="#ffffff" opacity="0.8"/>
</svg>
